kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Xshare:off
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xshare:off
android.enableComposeRenderer=true
org.gradle.kotlin.dsl.ignoreUnsupportedKotlinVersion=true
android.disallowKotlinSourceSets=false
# Opt-out of the new AGP DSL because the 'androidx.baselineprofile' plugin
# is not yet fully compatible with it (as of version 1.4.1/1.5.0-alpha07).
# This flag should be removed once the plugin adds support for the modern DSL.
android.newDsl=false

# Roborazzi configuration
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
